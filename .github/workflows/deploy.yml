name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build root app
        run: npm run build

      - name: Build admin portal
        working-directory: admin-portal
        run: npm ci && npm run build

      - name: Build customer portal
        working-directory: customer-portal
        run: npm ci && npm run build

      - name: Combine applications
        shell: bash
        run: |
          mkdir -p dist/admin-portal dist/customer-portal
          cp -R admin-portal/dist/. dist/admin-portal/
          cp -R customer-portal/dist/. dist/customer-portal/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
